services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: local_news_password
      POSTGRES_DB: news
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres-test:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_USER: news_test
      POSTGRES_PASSWORD: local_test_password
      POSTGRES_DB: news_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_test -d news_test"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
