[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kun-news-backend"
version = "0.1.0"
description = "Backend for news ingestion and summarization"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "openai>=2,<3",
    "google-genai>=1.75,<2",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
gemini-experiment = ["google-genai>=1.75,<2"]

[tool.setuptools.packages.find]
where = ["src"]
